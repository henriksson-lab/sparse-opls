[package]
name = "sparse_olps"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["cudarc"]
cuda-version-from-build-system = ["cudarc/cuda-version-from-build-system"]

[dependencies]
sprs = "0.11"
ndarray = "0.17"
cudarc = { version = "0.19", features = ["cusparse", "cublas"], optional = true }

[dev-dependencies]
rand = "0.9"
rand_chacha = "0.9"

[[bench]]
name = "bench_large"
harness = false
